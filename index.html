<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<title>他社リース 残期間・残額</title>
<style>
  :root{
    color-scheme:only light;
    --ink:#000000; --ink-2:#3A3A3A; --mute:#6E6E6E; --line:#E2DDD0;
    --bg:#FFFFFF; --pane:#F5F2EA;
    --brand:#3A79C9; --brand-hi:#5E9AE4; --brand-lo:#2E63AC;
    --go:#0E8A63; --warn:#C07A18;
    --tap:48px;
    --sheen:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0) 52%);
    --lift:0 1px 1px rgba(90,78,55,.06), 0 3px 8px rgba(90,78,55,.08);
    --lift-2:0 2px 6px rgba(90,78,55,.09), 0 14px 30px rgba(90,78,55,.14);
    --inset:inset 0 1px 0 rgba(255,255,255,.95);
  }
  /* 端末が暗くてもライトのまま */
  @media (prefers-color-scheme:dark){
    html, body{background:#F0EDE4 !important; color:var(--ink) !important}
    .field input, .field select{background:linear-gradient(180deg,#fff,#FBFAF6) !important; color:var(--ink) !important; -webkit-text-fill-color:var(--ink)}
    .field input::placeholder{color:var(--mute) !important; -webkit-text-fill-color:var(--mute)}
    .cmp{background:#fff !important}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; background:#F0EDE4}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg,#FAF9F5 0%,#F2EFE6 55%,#EDE9DD 100%) no-repeat fixed;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.5; font-variant-numeric:tabular-nums;
    padding-bottom:env(safe-area-inset-bottom);
  }
  main{max-width:560px; margin:0 auto; padding:0 16px 40px}

  /* header */
  header{display:flex; align-items:baseline; justify-content:space-between; padding:18px 0 6px}
  header h1{font-size:15px; font-weight:600; margin:0; letter-spacing:.02em; color:var(--ink-2)}
  header time{font-size:13px; color:var(--mute)}

  /* sections */
  section{margin-top:22px}
  h2{font-size:13px; font-weight:600; color:var(--ink-2); margin:0 0 10px; display:flex; align-items:center; gap:8px}
  h2 .dot{width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 32% 28%, var(--brand-hi), var(--brand-lo) 72%); box-shadow:0 1px 2px rgba(46,99,172,.35)}
  h2.go .dot{background:radial-gradient(circle at 32% 28%, #5FCFA6, var(--go) 72%)}

  /* fields */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid > *{min-width:0}
  .grid .full{grid-column:1/-1}
  .field label{display:block; font-size:12px; color:var(--ink-2); margin-bottom:4px}
  .field{min-width:0}
  .field input, .field select{
    width:100%; min-width:0; max-width:100%; height:var(--tap); font:inherit; font-size:17px; color:var(--ink);
    padding:0 12px; border:1px solid var(--line); border-radius:10px; outline:none;
    background:linear-gradient(180deg,#fff,#FBFAF6); box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 1px 2px rgba(90,78,55,.06); transition:box-shadow .15s, border-color .15s;
  }
  .field input[type=date]{-webkit-appearance:none; appearance:none; display:block}
  .field input:focus-visible, .field select:focus-visible, button:focus-visible{outline:3px solid #9DB8E8; outline-offset:1px}
  .field input:focus{border-color:#9DB8E8; box-shadow:0 0 0 3px rgba(157,184,232,.22), 0 1px 2px rgba(22,33,58,.05)}
  .field .unit{position:relative}
  .field .unit input{padding-right:44px}
  .field .unit span{position:absolute; right:12px; top:0; height:var(--tap); display:flex; align-items:center; font-size:13px; color:var(--mute)}
  .field input:user-invalid{border-color:#C0392B}

  /* segmented */
  .seg{position:relative; display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; height:40px; background:linear-gradient(180deg,#F4F1E9,#fff); box-shadow:inset 0 1px 3px rgba(90,78,55,.09)}
  .seg label{flex:1; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-2); cursor:pointer; user-select:none}
  .seg input{position:absolute; inset:0 auto auto 0; width:1px; height:1px; margin:0; opacity:0; pointer-events:none}
  .seg input:checked + label{color:#fff; background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo)); box-shadow:0 1px 3px rgba(46,99,172,.4), inset 0 1px 0 rgba(255,255,255,.45); border-radius:8px; margin:2px}
  .seg input:focus-visible + label{outline:3px solid #9DB8E8; outline-offset:-3px}
  .check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); min-height:32px}
  .check input{width:18px; height:18px; margin:0}

  /* buttons */
  button{font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .btn{height:var(--tap); border-radius:10px; border:1px solid var(--brand-lo); background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo)); color:#fff; box-shadow:0 2px 6px rgba(46,99,172,.28), inset 0 1px 0 rgba(255,255,255,.45); transition:transform .1s, box-shadow .15s; font-size:15px; font-weight:600; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%}
  .btn.ghost{background:linear-gradient(180deg,#fff,#F6F3EB); color:var(--ink); box-shadow:var(--lift), var(--inset)}
  .btn:active{transform:translateY(1px); box-shadow:0 1px 2px rgba(22,33,58,.12)}
  .btn.go{background:linear-gradient(180deg,#3FBF95,var(--go)); border-color:var(--go)}
  .btn:disabled{opacity:.5; cursor:default}
  .btn svg{width:18px; height:18px}


  /* result hero */
  .hero{position:relative; border-radius:16px; padding:18px 18px 14px; overflow:hidden;
    background:linear-gradient(160deg,#FFFFFF 0%,#F6F3EA 50%,#EDE8DA 100%);
    box-shadow:var(--lift-2), inset 0 1px 0 rgba(255,255,255,.95);}
  .hero::before{content:""; position:absolute; inset:0 0 auto; height:56%; background:var(--sheen); pointer-events:none}
  .hero > *{position:relative}
  .hero .row{display:grid; grid-template-columns:82px 1fr; gap:14px}
  .hero .row > div{min-width:0}
  .hero .k{font-size:12px; color:var(--ink-2)}
  .hero .v{font-size:clamp(24px,7.6vw,38px); white-space:nowrap; font-weight:700; line-height:1.1; letter-spacing:-.02em; margin-top:2px}
  .hero .v small{font-size:16px; font-weight:600; margin-left:2px; color:var(--ink-2)}
  .hero .sub{font-size:13px; color:var(--ink-2); margin-top:4px}
  .hero .end{margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.9); box-shadow:0 -1px 0 rgba(22,33,58,.05); font-size:14px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 12px}
  .hero .end b{font-weight:600}
  .hero.empty .v{color:var(--mute)}

  /* compare */
  .cmp{border:1px solid var(--line); border-radius:14px; background:#FFFDF9; box-shadow:var(--lift); overflow-x:auto; margin-top:12px; -webkit-overflow-scrolling:touch}
  .cmp table{width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed}
  .cmp col.lbl{width:34%}
  .cmp th{font-weight:500; color:var(--ink-2); text-align:left; padding:10px 12px; font-size:12px; background:linear-gradient(180deg,#FDFCF9,#F3F0E7)}
  .cmp th.num{text-align:right}
  .cmp td{padding:11px 10px; border-top:1px solid var(--line); text-align:right; white-space:nowrap}
  .cmp td:first-child{text-align:left; color:var(--ink-2); white-space:normal; padding-left:12px}
  .cmp tr.total td{font-weight:700; font-size:15px}
  .cmp td.go{color:var(--go); font-weight:600}
  .cmp td.bad{color:#C0392B; font-weight:600}
  .cost{margin-top:12px; flex-wrap:wrap; border-radius:12px; padding:12px 14px; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--go); background:linear-gradient(180deg,#F4FCF8,#DDF3EA); box-shadow:var(--lift), inset 0 1px 0 rgba(255,255,255,.9)}
  .cost.warn{color:var(--warn); background:linear-gradient(180deg,#FFFAF0,#FCEEDA)}
  .cost b{font-size:20px; font-weight:700}
  .cost .pct{font-size:12px; opacity:.8}
  .hint{font-size:12px; color:var(--mute); margin-top:8px; line-height:1.6}

  /* copy */
  .actions{display:flex; gap:10px; margin-top:16px}
  .actions .btn{white-space:nowrap}
  .actions #copyBtn{flex:1}
  .actions #clearBtn{flex:0 0 auto; width:auto; color:var(--ink-2); border-color:var(--line)}
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px); background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo)); color:#fff; font-size:14px; padding:10px 16px; border-radius:999px; box-shadow:var(--lift-2); opacity:0; pointer-events:none; transition:.2s}
  .toast.show{opacity:1; transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<main>
  <header>
    <h1>他社リース 残期間・残額</h1>
    <time id="today"></time>
  </header>

  <form id="f" novalidate>
  <!-- ───── 他社の契約 ───── -->
  <section>
    <h2><span class="dot"></span>今の契約（他社）</h2>


    <div class="grid">
      <div class="field full">
        <label for="lessor">リース会社</label>
        <input type="text" id="lessor" name="lessor" placeholder="例：〇〇リース" autocomplete="off">
      </div>

      <div class="field full">
        <div class="seg" role="radiogroup" aria-label="期間の入れ方">
          <input type="radio" name="mode" id="modeStart" value="start" checked><label for="modeStart">開始日＋期間</label>
          <input type="radio" name="mode" id="modeEnd" value="end"><label for="modeEnd">満了日で入れる</label>
        </div>
      </div>

      <div class="field" data-mode="start">
        <label for="start">契約開始日</label>
        <input type="date" id="start" name="start">
      </div>
      <div class="field" data-mode="start">
        <label for="term">契約期間</label>
        <div class="unit"><input type="text" id="term" name="term" inputmode="numeric" pattern="\d*" placeholder="60"><span>ヶ月</span></div>
      </div>
      <div class="field full" data-mode="end" hidden>
        <label for="end">満了日（最終支払月）</label>
        <input type="date" id="end" name="end">
      </div>

      <div class="field">
        <label for="monthly">月額</label>
        <div class="unit"><input type="text" id="monthly" name="monthly" inputmode="numeric" placeholder="12,000"><span>円</span></div>
      </div>
      <div class="field">
        <label>この月額は</label>
        <div class="seg" role="radiogroup" aria-label="税区分">
          <input type="radio" name="tax" id="taxEx" value="ex" checked><label for="taxEx">税抜</label>
          <input type="radio" name="tax" id="taxIn" value="in"><label for="taxIn">税込</label>
        </div>
      </div>
      <div class="field full">
        <label class="check"><input type="checkbox" id="paidThisMonth">今月分はもう支払い済み（残回数に含めない）</label>
      </div>
    </div>
  </section>

  <!-- ───── 結果 ───── -->
  <section>
    <h2><span class="dot"></span>残り</h2>
    <div class="hero empty" id="hero">
      <div class="row">
        <div><div class="k">残回数</div><div class="v" id="rMonths">—<small>回</small></div><div class="sub" id="rMonthsSub">今月分を含む</div></div>
        <div><div class="k">残額（税込）</div><div class="v" id="rAmt">—</div><div class="sub" id="rAmtSub">税抜 —</div></div>
      </div>
      <div class="end">
        <span>満了 <b id="rEnd">—</b></span>
        <span id="rElapsed"></span>
      </div>
    </div>
    <p class="hint">残額＝残回数×月額。中途解約時にリース会社へ払う残リース料の目安（解約金の規定は契約書で要確認）。</p>
  </section>

  <!-- ───── 乗り換え比較 ───── -->
  <section>
    <h2 class="go"><span class="dot"></span>レゾンに乗り換えたら</h2>
    <div class="grid">
      <div class="field">
        <label for="nMonthly">新リース月額（税抜）</label>
        <div class="unit"><input type="text" id="nMonthly" name="nMonthly" inputmode="numeric" placeholder="15,800"><span>円</span></div>
      </div>
      <div class="field">
        <label for="nTerm">新リース期間</label>
        <div class="unit"><input type="text" id="nTerm" name="nTerm" inputmode="numeric" pattern="\d*" value="60"><span>ヶ月</span></div>
      </div>
      <div class="field full">
        <label for="settle">他社の残額はどうする</label>
        <select id="settle" name="settle">
          <option value="us">レゾンが負担する（お客様は払わない）</option>
          <option value="add">新リースの月額に上乗せして回収する</option>
          <option value="cust">お客様が一括で精算する</option>
        </select>
      </div>
    </div>

    <div class="cmp">
      <table>
        <colgroup><col class="lbl"><col><col></colgroup>
        <thead><tr><th></th><th class="num">今のまま</th><th class="num">乗り換え</th></tr></thead>
        <tbody>
          <tr><td>月額（税込）</td><td id="cM0">—</td><td id="cM1">—</td></tr>
          <tr><td id="cSpan">残り分の支払い</td><td id="cP0">—</td><td id="cP1">—</td></tr>
          <tr><td>一括で払う分</td><td id="cL0">0円</td><td id="cL1">—</td></tr>
          <tr class="total"><td>差額</td><td></td><td id="cDiff">—</td></tr>
        </tbody>
      </table>
    </div>
    <div class="cost" id="cost" hidden></div>
    <p class="hint">残期間中の比較＝残回数分の月額を並べたもの。新リース総額＝新月額×新期間。「上乗せ」は残額（税抜）÷新期間を月額に足しています。</p>

    <div class="actions">
      <button type="button" class="btn" id="copyBtn">結果をコピー</button>
      <button type="button" class="btn ghost" id="clearBtn">クリア</button>
    </div>
  </section>

  </form>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAX = 0.10;
  const yen = n => (Math.round(n)).toLocaleString('ja-JP') + '円';
  const num = s => { const v = parseInt(String(s).replace(/[^\d]/g,''),10); return isNaN(v)?null:v; };
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const jp = d => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

  const today = new Date(); today.setHours(0,0,0,0);
  $('today').textContent = `${today.getFullYear()}/${pad(today.getMonth()+1)}/${pad(today.getDate())} 時点`;

  // ── 入力の見た目（カンマ）
  for (const id of ['monthly','nMonthly']) {
    $(id).addEventListener('blur', e => { const v = num(e.target.value); e.target.value = v==null?'':v.toLocaleString('ja-JP'); });
  }

  // ── モード切替
  const applyMode = () => {
    const m = document.querySelector('input[name=mode]:checked').value;
    document.querySelectorAll('[data-mode]').forEach(el => el.hidden = el.dataset.mode !== m);
  };
  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { applyMode(); calc(); }));

  // ── 計算
  function endDate(){
    const m = document.querySelector('input[name=mode]:checked').value;
    if (m === 'end') { const e = $('end').value; return e ? new Date(e+'T00:00:00') : null; }
    const s = $('start').value, t = num($('term').value);
    if (!s || !t) return null;
    const d = new Date(s+'T00:00:00');
    // 開始日＋期間ヶ月 − 1日 = 満了日（例 2021-04-01 + 60ヶ月 → 2026-03-31）
    const e = new Date(d.getFullYear(), d.getMonth()+t, d.getDate()-1);
    return e;
  }
  const monthsDiff = (a,b) => (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());

  function calc(){
    const end = endDate();
    const monthly = num($('monthly').value);
    const taxIn = document.querySelector('input[name=tax]:checked').value === 'in';
    const hero = $('hero');

    if (!end || !monthly) { hero.classList.add('empty'); reset(); return; }
    hero.classList.remove('empty');

    let remain = monthsDiff(today, end) + 1;            // 今月分を含む
    if ($('paidThisMonth').checked) remain -= 1;
    remain = Math.max(remain, 0);

    const mEx = taxIn ? monthly/(1+TAX) : monthly;     // 税抜月額
    const mIn = mEx*(1+TAX);
    const remEx = mEx*remain, remIn = mIn*remain;

    $('rMonths').innerHTML = `${remain}<small>回</small>`;
    $('rMonthsSub').textContent = remain===0 ? '満了しています' : ($('paidThisMonth').checked ? '来月分から' : '今月分を含む');
    $('rAmt').textContent = yen(remIn);
    $('rAmtSub').textContent = `税抜 ${yen(remEx)}`;
    $('rEnd').textContent = jp(end);
    const s = $('start').value;
    if (document.querySelector('input[name=mode]:checked').value==='start' && s) {
      const t = num($('term').value); $('rElapsed').textContent = `${t}回中 ${t-remain}回支払い済み`;
    } else $('rElapsed').textContent = '';

    // 乗り換え比較
    const nM = num($('nMonthly').value), nT = num($('nTerm').value) || 60;
    const settle = $('settle').value;
    $('cM0').textContent = yen(mIn);
    $('cP0').textContent = yen(remIn);
    $('cSpan').textContent = `残${remain}回の支払い`;
    const cost = $('cost');
    if (!nM) { for (const id of ['cM1','cP1','cL1','cDiff']) $(id).textContent='—'; cost.hidden=true; return; }

    let addEx = 0, lump = 0, ourCost = 0;
    if (settle==='add') addEx = remEx/nT;
    else if (settle==='cust') lump = remIn;
    else ourCost = remIn;
    const nIn = (nM+addEx)*(1+TAX);
    const pay1 = nIn*remain + lump;
    const diff = pay1 - remIn;

    $('cM1').innerHTML = yen(nIn) + (addEx? `<br><span style="font-size:12px;color:var(--mute)">うち上乗せ ${yen(addEx*(1+TAX))}</span>`:'');
    $('cP1').textContent = yen(nIn*remain);
    $('cL1').textContent = yen(lump);
    const d = $('cDiff');
    d.textContent = (diff>0?'+':diff<0?'−':'±') + yen(Math.abs(diff)).replace(/^-/,'');
    d.className = diff>0?'bad':diff<0?'go':'';

    const newTotal = nM*nT*(1+TAX);
    cost.hidden = false;
    if (settle==='us') {
      const pct = Math.round(ourCost/newTotal*100);
      cost.className = 'cost' + (pct>=30?' warn':'');
      cost.innerHTML = `<span>レゾンの負担（他社残額）</span><span><b>${yen(ourCost)}</b> <span class="pct">新リース総額 ${yen(newTotal)} の ${pct}%</span></span>`;
    } else if (settle==='add') {
      cost.className = 'cost';
      cost.innerHTML = `<span>他社残額は月額に上乗せして回収</span><span><b>${yen(nIn)}</b> <span class="pct">× ${nT}回 ＝ ${yen(nIn*nT)}</span></span>`;
    } else {
      cost.className = 'cost';
      cost.innerHTML = `<span>お客様が一括精算</span><span><b>${yen(lump)}</b> <span class="pct">＋新リース ${yen(newTotal)}</span></span>`;
    }
  }
  function reset(){
    $('rMonths').innerHTML = '—<small>回</small>'; $('rMonthsSub').textContent='今月分を含む';
    $('rAmt').textContent='—'; $('rAmtSub').textContent='税抜 —'; $('rEnd').textContent='—'; $('rElapsed').textContent='';
    for (const id of ['cM0','cM1','cP0','cP1','cL1','cDiff']) $(id).textContent='—';
    $('cL0').textContent='0円'; $('cSpan').textContent='残り分の支払い'; $('cost').hidden=true;
  }
  $('f').addEventListener('input', calc);
  $('f').addEventListener('change', calc);

  // ── コピー
  $('copyBtn').addEventListener('click', async () => {
    if ($('hero').classList.contains('empty')) { toast('先に契約内容を入れてください'); return; }
    const lines = [
      `【他社リース 残り】${$('today').textContent}`,
      `リース会社：${$('lessor').value || '—'}`,
      `満了：${$('rEnd').textContent}`,
      `残回数：${$('rMonths').textContent}（${$('rMonthsSub').textContent}）`,
      `残額：${$('rAmt').textContent}（${$('rAmtSub').textContent}）`,
    ];
    if (num($('nMonthly').value)) {
      lines.push('', '【レゾン乗り換え案】',
        `新月額：${$('cM1').textContent}　期間：${$('nTerm').value}ヶ月`,
        `残期間中の支払い：今のまま ${$('cP0').textContent} → 乗り換え ${$('cP1').textContent}（差 ${$('cDiff').textContent}）`,
        `残額の扱い：${$('settle').selectedOptions[0].textContent}`);
    }
    try { await navigator.clipboard.writeText(lines.join('\n')); toast('コピーしました'); }
    catch { prompt('コピーしてください', lines.join('\n')); }
  });
  $('clearBtn').addEventListener('click', () => {
    for (const id of ['lessor','start','term','end','monthly','nMonthly']) $(id).value='';
    $('nTerm').value='60'; $('paidThisMonth').checked=false; $('settle').value='us';
    calc();
  });

  let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

  applyMode(); calc();
})();
</script>
</body>
</html>
